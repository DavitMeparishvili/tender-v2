name: tender-demo

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ${DROPLET_ENV_FILE:-deploy/.env.droplet}
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Conservative settings leave RAM for Next.js, MinIO, Caddy, and Ubuntu.
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - tender_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file:
      - ${DROPLET_ENV_FILE:-deploy/.env.droplet}
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN}
    command: server /data --console-address ":9001"
    volumes:
      - tender_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["setup"]
    env_file:
      - ${DROPLET_ENV_FILE:-deploy/.env.droplet}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true
        mc admin policy attach local readwrite --user "$$MINIO_APP_ACCESS_KEY"

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - ${DROPLET_ENV_FILE:-deploy/.env.droplet}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_URL: ${APP_ORIGIN}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT}
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${MINIO_BUCKET}
      STORAGE_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file:
      - ${DROPLET_ENV_FILE:-deploy/.env.droplet}
    depends_on:
      app:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.droplet:/etc/caddy/Caddyfile:ro
      - tender_caddy_data:/data
      - tender_caddy_config:/config

volumes:
  tender_postgres_data:
  tender_minio_data:
  tender_caddy_data:
  tender_caddy_config:
