services:
  postgres-dev:
    image: postgres:17
    environment:
      POSTGRES_DB: tender_dev
      POSTGRES_USER: tender_local
      POSTGRES_PASSWORD: tender_local_only
    ports:
      - "5432:5432"
    volumes:
      - tender_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_local -d tender_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: tender_test
      POSTGRES_USER: tender_test
      POSTGRES_PASSWORD: tender_test_local_only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_test -d tender_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tender_local
      MINIO_ROOT_PASSWORD: tender_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tender_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tender_local tender_local_only &&
      mc mb --ignore-existing local/tender-dev local/tender-test
      "

volumes:
  tender_dev_data:
  tender_minio_data:
