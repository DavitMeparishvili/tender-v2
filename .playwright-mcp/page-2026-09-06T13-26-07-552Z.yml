    - generic [ref=e207]:
      - generic [ref=e208]:
        - paragraph [ref=e209]: Trust
        - heading "Price transparency, kept honest" [level=2] [ref=e210]
        - paragraph [ref=e211]: Every mechanism on the platform exists to make offers comparable and reputation earned. Administrators manage accounts, content and payments — they never choose a winner or arbitrate a dispute between users.
      - list [ref=e212]:
        - listitem [ref=e213]:
          - heading "Structured requirements" [level=3] [ref=e215]
          - paragraph [ref=e216]: Construction-specific fields instead of free text, so two offers can be compared line by line.
        - listitem [ref=e217]:
          - heading "Privacy before paid access" [level=3] [ref=e219]
          - paragraph [ref=e220]: Client identity and documents stay hidden until a provider unlocks the tender.
        - listitem [ref=e221]:
          - heading "Deadline-based selection" [level=3] [ref=e223]
          - paragraph [ref=e224]: When the clock runs out the lowest valid offer wins automatically. No quiet renegotiation.
        - listitem [ref=e225]:
          - heading "Job-bound reviews" [level=3] [ref=e227]
          - paragraph [ref=e228]: Only a verified completed engagement can produce a review, on either side.
