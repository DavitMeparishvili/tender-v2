      - paragraph [ref=e155]: How it works
      - heading "Two sides, one process" [level=2] [ref=e156]
      - paragraph [ref=e157]: Every tender follows the same recorded path from published requirement to reviewed completion.
      - generic [ref=e158]:
        - generic [ref=e159]:
          - heading "For clients" [level=3] [ref=e160]
          - list [ref=e164]:
            - listitem [ref=e165]:
              - generic [ref=e166]:
                - generic [ref=e167]: Describe the work in a structured form
                - generic [ref=e168]: Category, scope, materials, site conditions, schedule and deadline — so offers stay comparable.
            - listitem [ref=e169]:
              - generic [ref=e170]:
                - generic [ref=e171]: Receive offers while your identity stays private
                - generic [ref=e172]: Only providers with paid access see your full requirement and contact details.
            - listitem [ref=e173]:
              - generic [ref=e174]:
                - generic [ref=e175]: The deadline closes the tender
                - generic [ref=e176]: The lowest valid offer is selected automatically and the agreement is recorded on the platform.
            - listitem [ref=e177]:
              - generic [ref=e178]:
                - generic [ref=e179]: Confirm completion, then review
                - generic [ref=e180]: Reviews are bound to the finished job, so ratings reflect real work only.
          - link "Post a tender" [ref=e181] [cursor=pointer]:
            - /url: /en/register/client
        - generic [ref=e182]:
          - heading "For providers" [level=3] [ref=e183]
          - list [ref=e187]:
            - listitem [ref=e188]:
              - generic [ref=e189]:
                - generic [ref=e190]: Pick your categories and region
                - generic [ref=e191]: Relevant tenders reach you as they open, filtered to the work you actually do.
            - listitem [ref=e192]:
              - generic [ref=e193]:
                - generic [ref=e194]: Unlock access to bid
                - generic [ref=e195]: Paid access opens the full specification, attachments and client contact.
            - listitem [ref=e196]:
              - generic [ref=e197]:
                - generic [ref=e198]: Submit a priced offer
                - generic [ref=e199]: You see the current lowest price, so you know exactly where your bid stands.
            - listitem [ref=e200]:
              - generic [ref=e201]:
                - generic [ref=e202]: Win, deliver, build a record
                - generic [ref=e203]: Verified completions and job-bound reviews compound into a reputation that wins the next tender.
          - link "Find work" [ref=e204] [cursor=pointer]:
