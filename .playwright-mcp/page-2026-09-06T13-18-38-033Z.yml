    - generic [ref=e209]:
      - generic [ref=e210]:
        - paragraph [ref=e211]: Trust
        - heading "Price transparency, kept honest" [level=2] [ref=e212]
        - paragraph [ref=e213]: Every mechanism on the platform exists to make offers comparable and reputation earned. Administrators manage accounts, content and payments — they never choose a winner or arbitrate a dispute between users.
      - list [ref=e214]:
        - listitem [ref=e215]:
          - heading "Structured requirements" [level=3] [ref=e217]
          - paragraph [ref=e218]: Construction-specific fields instead of free text, so two offers can be compared line by line.
        - listitem [ref=e219]:
          - heading "Privacy before paid access" [level=3] [ref=e221]
          - paragraph [ref=e222]: Client identity and documents stay hidden until a provider unlocks the tender.
        - listitem [ref=e223]:
          - heading "Deadline-based selection" [level=3] [ref=e225]
          - paragraph [ref=e226]: When the clock runs out the lowest valid offer wins automatically. No quiet renegotiation.
        - listitem [ref=e227]:
          - heading "Job-bound reviews" [level=3] [ref=e229]
          - paragraph [ref=e230]: Only a verified completed engagement can produce a review, on either side.
