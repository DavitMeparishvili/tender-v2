      - paragraph [ref=e157]: How it works
      - heading "Two sides, one process" [level=2] [ref=e158]
      - paragraph [ref=e159]: Every tender follows the same recorded path from published requirement to reviewed completion.
      - generic [ref=e160]:
        - generic [ref=e161]:
          - heading "For clients" [level=3] [ref=e162]
          - list [ref=e166]:
            - listitem [ref=e167]:
              - generic [ref=e168]:
                - generic [ref=e169]: Describe the work in a structured form
                - generic [ref=e170]: Category, scope, materials, site conditions, schedule and deadline — so offers stay comparable.
            - listitem [ref=e171]:
              - generic [ref=e172]:
                - generic [ref=e173]: Receive offers while your identity stays private
                - generic [ref=e174]: Only providers with paid access see your full requirement and contact details.
            - listitem [ref=e175]:
              - generic [ref=e176]:
                - generic [ref=e177]: The deadline closes the tender
                - generic [ref=e178]: The lowest valid offer is selected automatically and the agreement is recorded on the platform.
            - listitem [ref=e179]:
              - generic [ref=e180]:
                - generic [ref=e181]: Confirm completion, then review
                - generic [ref=e182]: Reviews are bound to the finished job, so ratings reflect real work only.
          - link "Post a tender" [ref=e183] [cursor=pointer]:
            - /url: /en/register/client
        - generic [ref=e184]:
          - heading "For providers" [level=3] [ref=e185]
          - list [ref=e189]:
            - listitem [ref=e190]:
              - generic [ref=e191]:
                - generic [ref=e192]: Pick your categories and region
                - generic [ref=e193]: Relevant tenders reach you as they open, filtered to the work you actually do.
            - listitem [ref=e194]:
              - generic [ref=e195]:
                - generic [ref=e196]: Unlock access to bid
                - generic [ref=e197]: Paid access opens the full specification, attachments and client contact.
            - listitem [ref=e198]:
