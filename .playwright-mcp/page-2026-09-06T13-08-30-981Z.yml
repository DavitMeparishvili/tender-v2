    - generic [ref=f3e154]:
      - paragraph [ref=f3e155]: How it works
      - heading "Two sides, one process" [level=2] [ref=f3e156]
      - paragraph [ref=f3e157]: Every tender follows the same recorded path from published requirement to reviewed completion.
      - generic [ref=f3e158]:
        - generic [ref=f3e159]:
          - heading "For clients" [level=3] [ref=f3e160]
          - list [ref=f3e164]:
            - listitem [ref=f3e165]:
              - generic [ref=f3e166]:
                - generic [ref=f3e167]: Describe the work in a structured form
                - generic [ref=f3e168]: Category, scope, materials, site conditions, schedule and deadline — so offers stay comparable.
            - listitem [ref=f3e169]:
              - generic [ref=f3e170]:
                - generic [ref=f3e171]: Receive offers while your identity stays private
                - generic [ref=f3e172]: Only providers with paid access see your full requirement and contact details.
            - listitem [ref=f3e173]:
              - generic [ref=f3e174]:
                - generic [ref=f3e175]: The deadline closes the tender
                - generic [ref=f3e176]: The lowest valid offer is selected automatically and the agreement is recorded on the platform.
            - listitem [ref=f3e177]:
              - generic [ref=f3e178]:
                - generic [ref=f3e179]: Confirm completion, then review
                - generic [ref=f3e180]: Reviews are bound to the finished job, so ratings reflect real work only.
          - link "Post a tender" [ref=f3e181] [cursor=pointer]:
            - /url: /en/register/client
        - generic [ref=f3e182]:
          - heading "For providers" [level=3] [ref=f3e183]
          - list [ref=f3e187]:
            - listitem [ref=f3e188]:
              - generic [ref=f3e189]:
                - generic [ref=f3e190]: Pick your categories and region
                - generic [ref=f3e191]: Relevant tenders reach you as they open, filtered to the work you actually do.
            - listitem [ref=f3e192]:
              - generic [ref=f3e193]:
                - generic [ref=f3e194]: Unlock access to bid
                - generic [ref=f3e195]: Paid access opens the full specification, attachments and client contact.
            - listitem [ref=f3e196]:
              - generic [ref=f3e197]:
                - generic [ref=f3e198]: Submit a priced offer
                - generic [ref=f3e199]: You see the current lowest price, so you know exactly where your bid stands.
            - listitem [ref=f3e200]:
              - generic [ref=f3e201]:
                - generic [ref=f3e202]: Win, deliver, build a record
                - generic [ref=f3e203]: Verified completions and job-bound reviews compound into a reputation that wins the next tender.
          - link "Find work" [ref=f3e204] [cursor=pointer]:
            - /url: /en/register/provider
    - generic [ref=f3e207]:
      - generic [ref=f3e208]:
        - paragraph [ref=f3e209]: Trust
        - heading "Price transparency, kept honest" [level=2] [ref=f3e210]
        - paragraph [ref=f3e211]: Every mechanism on the platform exists to make offers comparable and reputation earned. Administrators manage accounts, content and payments — they never choose a winner or arbitrate a dispute between users.
      - list [ref=f3e212]:
        - listitem [ref=f3e213]:
          - heading "Structured requirements" [level=3] [ref=f3e215]
          - paragraph [ref=f3e216]: Construction-specific fields instead of free text, so two offers can be compared line by line.
        - listitem [ref=f3e217]:
          - heading "Privacy before paid access" [level=3] [ref=f3e219]
          - paragraph [ref=f3e220]: Client identity and documents stay hidden until a provider unlocks the tender.
        - listitem [ref=f3e221]:
          - heading "Deadline-based selection" [level=3] [ref=f3e223]
          - paragraph [ref=f3e224]: When the clock runs out the lowest valid offer wins automatically. No quiet renegotiation.
        - listitem [ref=f3e225]:
          - heading "Job-bound reviews" [level=3] [ref=f3e227]
          - paragraph [ref=f3e228]: Only a verified completed engagement can produce a review, on either side.
    - generic [ref=f3e230]:
