      - paragraph [ref=e179]: How it works
      - heading "Two sides, one process" [level=2] [ref=e180]
      - paragraph [ref=e181]: Every tender follows the same recorded path from published requirement to reviewed completion.
      - generic [ref=e182]:
        - generic [ref=e183]:
          - heading "For clients" [level=3] [ref=e184]
          - list [ref=e188]:
            - listitem [ref=e189]:
              - generic [ref=e190]:
                - generic [ref=e191]: Describe the work in a structured form
                - generic [ref=e192]: Category, scope, materials, site conditions, schedule and deadline — so offers stay comparable.
            - listitem [ref=e193]:
              - generic [ref=e194]:
                - generic [ref=e195]: Receive offers while your identity stays private
                - generic [ref=e196]: Only providers with paid access see your full requirement and contact details.
            - listitem [ref=e197]:
              - generic [ref=e198]:
                - generic [ref=e199]: The deadline closes the tender
                - generic [ref=e200]: The lowest valid offer is selected automatically and the agreement is recorded on the platform.
            - listitem [ref=e201]:
              - generic [ref=e202]:
                - generic [ref=e203]: Confirm completion, then review
                - generic [ref=e204]: Reviews are bound to the finished job, so ratings reflect real work only.
          - link "Post a tender" [ref=e205] [cursor=pointer]:
            - /url: /en/register/client
        - generic [ref=e206]:
          - heading "For providers" [level=3] [ref=e207]
          - list [ref=e211]:
            - listitem [ref=e212]:
              - generic [ref=e213]:
                - generic [ref=e214]: Pick your categories and region
                - generic [ref=e215]: Relevant tenders reach you as they open, filtered to the work you actually do.
            - listitem [ref=e216]:
