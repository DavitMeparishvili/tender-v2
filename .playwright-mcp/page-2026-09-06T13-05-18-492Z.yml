    - generic [ref=e231]:
      - generic [ref=e232]:
        - paragraph [ref=e233]: Trust
        - heading "Price transparency, kept honest" [level=2] [ref=e234]
        - paragraph [ref=e235]: Every mechanism on the platform exists to make offers comparable and reputation earned. Administrators manage accounts, content and payments — they never choose a winner or arbitrate a dispute between users.
      - list [ref=e236]:
        - listitem [ref=e237]:
          - heading "Structured requirements" [level=3] [ref=e239]
          - paragraph [ref=e240]: Construction-specific fields instead of free text, so two offers can be compared line by line.
        - listitem [ref=e241]:
          - heading "Privacy before paid access" [level=3] [ref=e243]
          - paragraph [ref=e244]: Client identity and documents stay hidden until a provider unlocks the tender.
        - listitem [ref=e245]:
          - heading "Deadline-based selection" [level=3] [ref=e247]
          - paragraph [ref=e248]: When the clock runs out the lowest valid offer wins automatically. No quiet renegotiation.
        - listitem [ref=e249]:
          - heading "Job-bound reviews" [level=3] [ref=e251]
          - paragraph [ref=e252]: Only a verified completed engagement can produce a review, on either side.
