name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  phase-1:
    name: Phase 1 identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tender_ci_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/tender_ci_test
      AUTH_SECRET: ci-only-auth-secret-0123456789012345
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: development
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tender_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tender_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate test database
        run: pnpm db:migrate:test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Phase 1 seed password
        shell: bash
        run: echo "PHASE_1_SEED_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run Phase 1 gate
        run: pnpm verify:phase-1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
