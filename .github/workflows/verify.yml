name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  phase-0:
    name: Phase 0 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tender_ci_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/tender_ci_test
      AUTH_SECRET: ci-only-auth-secret-0123456789012345
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: development
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tender_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tender_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate test database
        run: pnpm db:migrate:test

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verify module boundaries
        run: pnpm verify:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit
        env:
          NODE_ENV: test

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test

      - name: Build production application
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production-server E2E
        run: pnpm test:e2e
        env:
          NODE_ENV: production

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
